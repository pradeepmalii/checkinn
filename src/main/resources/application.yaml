spring:
  application:
    name: CheckInn

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/checkinnDB}
    username: ${DB_USER}
    password: ${DB_PASS}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
    port: 8081

    servlet:
      context-path: /api/v1

